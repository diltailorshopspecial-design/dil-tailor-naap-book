<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دل ٹیلر شاپ - جھنگ</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet"><style>body{margin:0;background:#FDF6E3;font-family:'Noto Nastaliq Urdu',sans-serif}.top{background:#0A3D2E;color:#fff;text-align:center;padding:12px;border-bottom:4px solid #C9A86A}.card{background:#fff;margin:12px;border-radius:16px;padding:14px;border:1.5px solid #EADDBB;box-shadow:0 2px 8px rgba(0,0,0,.05)}.head{font-weight:700;background:#FFF7D6;padding:10px 14px;border-radius:10px;margin:-14px -14px 12px;border-bottom:2px solid #EADDBB;color:#0A3D2E}label{font-size:12px;font-weight:700;color:#6B5A2A;display:block;margin-top:8px}input,select,textarea{width:100%;padding:11px;border:1.6px solid #D8C99E;border-radius:10px;background:#FFFEF7;font-size:13px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.opt{border:1.6px solid #D8C99E;border-radius:22px;padding:11px;text-align:center;background:#FFFEF7;cursor:pointer}.opt.active{background:#0A3D2E!important;color:#fff!important}.jeb{border:2px dashed #0A3D2E;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:700}.jeb.active{background:#0A3D2E!important;color:#fff!important;border-style:solid!important}.btn{border:none;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.btn-save{background:#0A3D2E;color:#fff;width:100%;margin-top:14px;font-size:17px;padding:14px;border-radius:12px}.online{background:#DCFCE7;color:#14532D;text-align:center;padding:8px;border-radius:10px;margin:10px;font-size:12px;font-weight:700}img.prev{width:65px;height:65px;object-fit:cover;border-radius:10px;border:2px solid #EADDBB;margin:3px}.photo-wrap{position:relative;display:inline-block;margin:3px}.btn-del{position:absolute;top:-6px;right:-6px;background:#B91C1C;color:#fff;border:none;border-radius:50%;width:22px;height:22px}@media print{.no-print{display:none!important}#printArea{display:block!important}}</style></head><body><div class="top no-print"><b>دل ٹیلر شاپ سپیشل - جھنگ</b><br><span style="font-size:11px;color:#C9A86A">ڈیجیٹل ناپ بک - پرانا ڈیزائن واپس</span></div><div id="net" class="online no-print">ONLINE - 5 Email Backup Active</div><div class="max-w-[560px] mx-auto no-print"><div class="card"><div class="head">تلاش</div><div class="g2"><input id="q" oninput="search()" placeholder="نام / موبائل / سیریل..."><button onclick="load()" class="btn" style="background:#000;color:#fff">All</button></div></div><form id="f" onsubmit="save(event)" class="card"><div class="head">نیا ناپ - Naya Naap</div><div class="g2"><div><label>سیریل *</label><input required id="serialNo" style="background:#FFF9C4;font-weight:700"></div><div><label>سوٹ تعداد</label><select id="suitQty"><option>1 سوٹ</option><option>2 سوٹ</option><option>3 سوٹ</option><option>4 سوٹ</option></select></div></div><label>گاہک کا نام *</label><input required id="customerName" placeholder="Customer Name"><div class="g2"><div><label>موبائل</label><input id="mobile"></div><div><label>پتہ</label><input id="pata"></div></div><div class="g2"><div><label>آرڈر تاریخ</label><input type="date" id="orderDate"></div><div><label>واپسی تاریخ</label><input type="date" id="deliveryDate"></div></div><div class="head" style="margin-top:14px">گلے کی قسم</div><div class="g2"><div class="opt active" id="oc" onclick="setG('کالر')">کالر والا</div><div class="opt" id="ob" onclick="setG('بین')">بین والا</div></div><input type="hidden" id="gallaType" value="کالر"><div style="background:#FFF7D6;padding:12px;border-radius:12px;border:1px solid #EADDBB;margin-top:10px"><p style="margin:0 0 8px 0;font-weight:700;font-size:13px;color:#0A3D2E">قمیض ناپ</p><div class="g3"><input id="lambai" placeholder="لمبائی"><input id="bazu" placeholder="بازو"><input id="teera" placeholder="تیرا"><input id="gala" placeholder="گلا"><input id="chhati" placeholder="چھاتی"><input id="kamar" placeholder="کمر"><input id="gheera" placeholder="گھیرا"><input id="moda" placeholder="موڈا"><input id="kaff" placeholder="کف"></div></div><div style="background:#F7F3E8;padding:12px;border-radius:12px;margin-top:10px"><div class="g2"><input id="shalwarLambai" placeholder="شلوار لمبائی"><input id="pouncha" placeholder="پونچہ"></div></div><div class="g3" style="margin-top:10px"><div class="jeb" id="js" onclick="setJ('سنگل جیب')">سنگل جیب</div><div class="jeb" id="jd" onclick="setJ('ڈبل جیب')">ڈبل جیب</div><div class="jeb" id="jn" onclick="setJ('بغیر جیب')">بغیر جیب</div></div><input type="hidden" id="jebType"><div class="head" style="margin-top:14px">کسٹمر / ڈیزائن فوٹو (کیمرہ / گیلری)</div><div class="g2"><div class="btn" style="border:1.6px solid #0A3D2E;text-align:center;background:#FFFEF7" onclick="document.getElementById('pi').click()">📷 فوٹو منتخب کریں</div><div class="btn" style="border-color:#B91C1C;color:#B91C1C;text-align:center;background:#fff" onclick="clearP()">🗑️ فوٹو ختم</div></div><input type="file" id="pi" accept="image/*" multiple style="display:none" onchange="handle(this)"><div id="pp" style="display:flex;flex-wrap:wrap;margin-top:8px"></div><div class="g3" style="margin-top:12px"><div><label style="color:#166534">ٹوٹل</label><input id="totalPrice" type="number" oninput="calc()" style="background:#DCFCE7;font-weight:700"></div><div><label style="color:#1E40AF">ایڈوانس</label><input id="advance" type="number" oninput="calc()" style="background:#DBEAFE;font-weight:700"></div><div><label style="color:#991B1B">بقایا</label><input id="baqaya" readonly style="background:#FEE2E2;font-weight:700"></div></div><label>نوٹ</label><textarea id="note"></textarea><button id="btn" class="btn btn-save">💾 ناپ محفوظ کریں</button><div class="g2" style="margin-top:10px"><button type="button" onclick="printC()" class="btn" style="background:#1F2937;color:#fff">🖨️ پرنٹ پرچی</button><button type="button" onclick="waC()" class="btn" style="background:#16A34A;color:#fff">📱 واٹس ایپ</button></div></form><div id="list" style="padding-bottom:30px"></div></div></div><div id="printArea" style="display:none;padding:20px;max-width:360px;margin:auto;background:#fff"><h2 style="text-align:center">دل ٹیلر شاپ - جھنگ</h2><div id="pc" style="font-size:13px;line-height:1.6"></div></div><script>
const API="https://script.google.com/macros/s/AKfycbzaLhSDFkyOUZGGJJRdIZ-FLf-_Kmxm7rxvKoxn6mRhrvmaGURgi2AKX8j_WT_szkwQ/exec";
let data=JSON.parse(localStorage.getItem('dil_data')||'[]');let curP=[];
function calc(){let t=parseInt(document.getElementById('totalPrice').value||0);let a=parseInt(document.getElementById('advance').value||0);document.getElementById('baqaya').value=t-a}function v(id){return document.getElementById(id)?.value||''}function setG(t){document.getElementById('gallaType').value=t;document.querySelectorAll('.opt').forEach(e=>e.classList.remove('active'));document.getElementById(t=='کالر'?'oc':'ob').classList.add('active')}function setJ(t){document.getElementById('jebType').value=t;document.querySelectorAll('.jeb').forEach(e=>e.classList.remove('active'));if(t=='سنگل جیب')document.getElementById('js').classList.add('active');if(t=='ڈبل جیب')document.getElementById('jd').classList.add('active');if(t=='بغیر جیب')document.getElementById('jn').classList.add('active')}function gen(){if(data.length==0){document.getElementById('serialNo').value='1';return}let m=Math.max(...data.map(d=>parseInt(d.serialNo)||0));document.getElementById('serialNo').value=m+1}function handle(i){for(let file of i.files){let r=new FileReader();r.onload=e=>{curP.push(e.target.result);rp()};r.readAsDataURL(file)}}function rp(){let d=document.getElementById('pp');d.innerHTML='';curP.forEach((s,i)=>{d.innerHTML+=`<div class=photo-wrap><img src=${s} class=prev><button class=btn-del onclick=rem(${i})>×</button></div>`})}function rem(i){curP.splice(i,1);rp()}function clearP(){curP=[];rp()}async function save(e){e.preventDefault();let b=document.getElementById('btn');b.innerText='Saving...';b.disabled=true;let d={serialNo:v('serialNo'),customerName:v('customerName'),mobile:v('mobile'),pata:v('pata'),orderDate:v('orderDate'),deliveryDate:v('deliveryDate'),suitQty:v('suitQty'),gallaType:v('gallaType'),jebType:v('jebType'),lambai:v('lambai'),bazu:v('bazu'),teera:v('teera'),gala:v('gala'),chhati:v('chhati'),kamar:v('kamar'),gheera:v('gheera'),moda:v('moda'),kaff:v('kaff'),shalwarLambai:v('shalwarLambai'),pouncha:v('pouncha'),totalPrice:v('totalPrice'),advance:v('advance'),baqaya:v('baqaya'),note:v('note'),photos:curP.join('||')};let i=data.findIndex(x=>x.serialNo==d.serialNo);if(i>=0)data[i]=d;else data.push(d);localStorage.setItem('dil_data',JSON.stringify(data));try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'save',payload:d})})}catch{}alert('ماشاءاللہ Save ہو گیا!');document.getElementById('f').reset();curP=[];rp();setG('کالر');gen();render(data);b.innerText='💾 ناپ محفوظ کریں';b.disabled=false}function render(arr){let h='';arr.slice().reverse().slice(0,80).forEach(d=>{let pc=d.photos?d.photos.split('||').filter(x=>x).length:0;h+=`<div class=card style=display:flex;justify-content:space-between;align-items:center><div style=flex:1><b style=color:#0A3D2E>#${d.serialNo} - ${d.customerName}</b><br><span style=font-size:11px;color:#666>${d.mobile||''} | Rs.${d.totalPrice||0} | بقایا ${d.baqaya||0} ${pc?'📷'+pc:''}</span></div><div style=display:flex;gap:4px;flex-wrap:wrap;max-width:160px;justify-content:end><button onclick=edit('${d.serialNo}') class=btn style=background:#2563EB;color:#fff;padding:5px 8px;font-size:11px>Ed</button><button onclick=printOne('${d.serialNo}') class=btn style=background:#1F2937;color:#fff;padding:5px 8px;font-size:11px>Pr</button><button onclick=waOne('${d.serialNo}') class=btn style=background:#16A34A;color:#fff;padding:5px 8px;font-size:11px>WA</button><button onclick=del('${d.serialNo}') class=btn style=background:#DC2626;color:#fff;padding:5px 8px;font-size:11px>Del</button></div></div>`});document.getElementById('list').innerHTML=h}function edit(s){let d=data.find(x=>x.serialNo==s);if(!d)return;Object.keys(d).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=d[k]});if(d.gallaType)setG(d.gallaType);if(d.jebType)setJ(d.jebType);if(d.photos){curP=d.photos.split('||').filter(x=>x);rp()}window.scrollTo({top:0,behavior:'smooth'})}async function del(s){if(!confirm('Delete '+s+'?'))return;data=data.filter(x=>x.serialNo!=s);localStorage.setItem('dil_data',JSON.stringify(data));try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',serialNo:s})})}catch{}render(data);gen()}function search(){let q=document.getElementById('q').value.toLowerCase();if(!q){render(data);return}let f=data.filter(d=>(d.customerName+' '+d.mobile+' '+d.serialNo).toLowerCase().includes(q));render(f)}function getH(d){let ph='';if(d.photos){let a=d.photos.split('||').filter(x=>x);a.forEach(src=>{ph+=`<img src=${src} style=width:70px;height:70px;object-fit:cover;border:1px solid #000;margin:2px>`})}return `<p><b>Serial:</b> ${d.serialNo} | <b>Galla:</b> ${d.gallaType||''}</p><p><b>Name:</b> ${d.customerName} | <b>Mob:</b> ${d.mobile||''}</p><p><b>Pata:</b> ${d.pata||''} | <b>Del:</b> ${d.deliveryDate||''} | <b>Jeb:</b> ${d.jebType||''}</p><hr><p>L:${d.lambai||'-'} B:${d.bazu||'-'} T:${d.teera||'-'} G:${d.gala||'-'} Ch:${d.chhati||'-'} K:${d.kamar||'-'} Gh:${d.gheera||'-'} M:${d.moda||'-'} Kf:${d.kaff||'-'}</p><p>Shalwar:${d.shalwarLambai||'-'} P:${d.pouncha||'-'}</p><hr><p>Total: Rs.${d.totalPrice||0} Adv: Rs.${d.advance||0} Baqaya: Rs.${d.baqaya||0}</p><p>Note:${d.note||''}</p><div>${ph}</div>`}function printOne(s){let d=data.find(x=>x.serialNo==s);if(!d)return;document.getElementById('pc').innerHTML=getH(d);window.print()}function printC(){let d={serialNo:v('serialNo'),customerName:v('customerName')||'Cust',mobile:v('mobile'),pata:v('pata'),orderDate:v('orderDate'),deliveryDate:v('deliveryDate'),gallaType:v('gallaType'),jebType:v('jebType'),lambai:v('lambai'),bazu:v('bazu'),teera:v('teera'),gala:v('gala'),chhati:v('chhati'),kamar:v('kamar'),gheera:v('gheera'),moda:v('moda'),kaff:v('kaff'),shalwarLambai:v('shalwarLambai'),pouncha:v('pouncha'),totalPrice:v('totalPrice'),advance:v('advance'),baqaya:v('baqaya'),note:v('note'),photos:curP.join('||')};if(!d.customerName){alert('Naam likho');return}document.getElementById('pc').innerHTML=getH(d);window.print()}function waOne(s){let d=data.find(x=>x.serialNo==s);if(!d)return;let msg=`*دل ٹیلر شاپ - جھنگ*%0A*ناپ پرچی*%0ASerial: ${d.serialNo}%0AName: ${d.customerName}%0AGalla: ${d.gallaType||''}%0AL:${d.lambai} B:${d.bazu} T:${d.teera}%0ATotal: Rs.${d.totalPrice} Adv: Rs.${d.advance} Baq: Rs.${d.baqaya}%0ADel: ${d.deliveryDate}%0AShukria!`;let num=d.mobile?d.mobile.replace(/[^0-9]/g,''):'';if(num.length==10)num='92'+num;if(num.length==11&&num.startsWith('0'))num='92'+num.substring(1);let url=num?`https://wa.me/${num}?text=${msg}`:`https://wa.me/?text=${msg}`;window.open(url,'_blank')}function waC(){let d={serialNo:v('serialNo'),customerName:v('customerName'),mobile:v('mobile'),lambai:v('lambai'),bazu:v('bazu'),teera:v('teera'),totalPrice:v('totalPrice'),advance:v('advance'),baqaya:v('baqaya'),deliveryDate:v('deliveryDate'),gallaType:v('gallaType')};if(!d.customerName){alert('Naam likho');return}waOne(d.serialNo)}async function load(){document.getElementById('net').innerText='SYNCING...';try{let r=await fetch(API+'?action=getAll');let t=await r.text();let a=JSON.parse(t);if(Array.isArray(a)&&a.length>1){let hh=a[0];let mm=a.slice(1).map(row=>{let o={};hh.forEach((h,i)=>o[h]=row[i]);return {serialNo:o.SerialNo,customerName:o.CustomerName,mobile:o.Mobile,pata:o.Pata,orderDate:o.OrderDate,deliveryDate:o.DeliveryDate,suitQty:o.SuitQty,gallaType:o.GallaType,jebType:o.JebType,lambai:o.Lambai,bazu:o.Bazu,teera:o.Teera,gala:o.Gala,chhati:o.Chhati,kamar:o.Kamar,gheera:o.Gheera,moda:o.Moda,kaff:o.Kaff,shalwarLambai:o.ShalwarLambai,pouncha:o.Pouncha,totalPrice:o.TotalPrice,advance:o.Advance,baqaya:o.Baqaya,note:o.Note,photos:o.Photos||''}});if(mm.length>0){data=mm;localStorage.setItem('dil_data',JSON.stringify(data))}}}catch{}document.getElementById('net').innerText='ONLINE - 5 Email Backup Active';render(data)}window.onload=()=>{document.getElementById('orderDate').valueAsDate=new Date();gen();render(data);if(navigator.onLine)load()};
</script></body></html>
