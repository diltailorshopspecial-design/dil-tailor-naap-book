<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dil Tailor Naap Book</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f3ef]"><div class="bg-black text-white p-4 flex justify-between"><h1>Dil Tailor Shop</h1><span id="st" class="text-xs bg-green-600 px-2 py-1 rounded">ONLINE</span></div><div class="max-w-[500px] mx-auto p-3"><div class="bg-white p-3 rounded-xl mb-3 flex gap-2"><input id="q" oninput="search()" placeholder="Search..." class="flex-1 border px-3 py-2 rounded"><button onclick="load()" class="bg-black text-white px-3 rounded text-xs">All</button></div><form id="f" onsubmit="save(event)" class="bg-white p-4 rounded-2xl space-y-2 shadow"><h2 class="font-bold border-b pb-2">Naya Naap</h2><div class="grid grid-cols-2 gap-2"><div><label class="text-[11px]">Serial *</label><input required id="serialNo" class="w-full border rounded px-2 py-2 bg-yellow-50"></div><div><label class="text-[11px]">Suit Qty</label><select id="suitQty" class="w-full border rounded px-2 py-2"><option>1</option><option>2</option><option>3</option></select></div></div><input required id="customerName" placeholder="Customer Name *" class="w-full border rounded px-2 py-2"><div class="grid grid-cols-2 gap-2"><input id="mobile" placeholder="Mobile" class="w-full border rounded px-2 py-2"><input id="pata" placeholder="Pata" class="w-full border rounded px-2 py-2"></div><div class="grid grid-cols-2 gap-2"><input type="date" id="orderDate" class="w-full border rounded px-2 py-2"><input type="date" id="deliveryDate" class="w-full border rounded px-2 py-2"></div><div class="bg-[#faf6f0] p-2 rounded"><div class="grid grid-cols-3 gap-2"><input id="lambai" placeholder="Lambai" class="border rounded px-1 py-1"><input id="bazu" placeholder="Bazu" class="border rounded px-1 py-1"><input id="teera" placeholder="Teera" class="border rounded px-1 py-1"><input id="gala" placeholder="Gala" class="border rounded px-1 py-1"><input id="chhati" placeholder="Chhati" class="border rounded px-1 py-1"><input id="kamar" placeholder="Kamar" class="border rounded px-1 py-1"><input id="gheera" placeholder="Gheera" class="border rounded px-1 py-1"><input id="moda" placeholder="Moda" class="border rounded px-1 py-1"><input id="kaff" placeholder="Kaff" class="border rounded px-1 py-1"></div></div><div class="grid grid-cols-2 gap-2"><input id="shalwarLambai" placeholder="Shalwar L" class="border rounded px-2 py-2"><input id="pouncha" placeholder="Pouncha" class="border rounded px-2 py-2"></div><div class="grid grid-cols-3 gap-2"><input id="totalPrice" type="number" oninput="calc()" placeholder="Total" class="border rounded px-2 py-2 bg-green-50"><input id="advance" type="number" oninput="calc()" placeholder="Advance" class="border rounded px-2 py-2 bg-blue-50"><input id="baqaya" readonly placeholder="Baqaya" class="border rounded px-2 py-2 bg-red-50"></div><textarea id="note" placeholder="Note" class="w-full border rounded px-2 py-2"></textarea><button id="btn" class="w-full bg-black text-white py-3 rounded-xl font-bold">SAVE NAAP</button><p class="text-[9px] text-center text-gray-500">Backup 5 Emails | Chrome Removed</p></form><div id="list" class="mt-4 space-y-2"></div></div><script>
const API="https://script.google.com/macros/s/AKfycbzaLhSDFkyOUZGGJJRdIZ-FLf-_Kmxm7rxvKoxn6mRhrvmaGURgi2AKX8j_WT_szkwQ/exec";
let data=JSON.parse(localStorage.getItem('dil_data')||'[]');
function calc(){let t=parseInt(document.getElementById('totalPrice').value||0);let a=parseInt(document.getElementById('advance').value||0);document.getElementById('baqaya').value=t-a;}
function v(id){return document.getElementById(id)?.value||'';}
function gen(){if(data.length==0){document.getElementById('serialNo').value='1';return;}let m=Math.max(...data.map(d=>parseInt(d.serialNo)||0));document.getElementById('serialNo').value=m+1;}
async function save(e){e.preventDefault();let b=document.getElementById('btn');b.innerText='Saving...';b.disabled=true;let d={serialNo:v('serialNo'),customerName:v('customerName'),mobile:v('mobile'),pata:v('pata'),orderDate:v('orderDate'),deliveryDate:v('deliveryDate'),suitQty:v('suitQty'),lambai:v('lambai'),bazu:v('bazu'),teera:v('teera'),gala:v('gala'),chhati:v('chhati'),kamar:v('kamar'),gheera:v('gheera'),moda:v('moda'),kaff:v('kaff'),shalwarLambai:v('shalwarLambai'),pouncha:v('pouncha'),totalPrice:v('totalPrice'),advance:v('advance'),baqaya:v('baqaya'),note:v('note')};let i=data.findIndex(x=>x.serialNo==d.serialNo);if(i>=0)data[i]=d;else data.push(d);localStorage.setItem('dil_data',JSON.stringify(data));try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'save',payload:d})});}catch(e){}alert('Save ho gaya! 5 Emails Backup OK');document.getElementById('f').reset();gen();render(data);b.innerText='SAVE NAAP';b.disabled=false;}
function render(arr){let h='';arr.slice().reverse().slice(0,40).forEach(d=>{h+=`<div class="bg-white p-3 rounded-xl shadow flex justify-between"><div><b>${d.serialNo} - ${d.customerName}</b><br><span class="text-xs">${d.mobile} | Rs.${d.totalPrice||0}</span></div><div class="flex gap-1"><button onclick="edit('${d.serialNo}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Edit</button><button onclick="del('${d.serialNo}')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Del</button></div></div>`;});document.getElementById('list').innerHTML=h;}
function edit(s){let d=data.find(x=>x.serialNo==s);Object.keys(d).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=d[k];});window.scrollTo(0,0);}
async function del(s){if(!confirm('Delete?'))return;data=data.filter(x=>x.serialNo!=s);localStorage.setItem('dil_data',JSON.stringify(data));try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',serialNo:s})});}catch(e){}render(data);gen();}
function search(){let q=document.getElementById('q').value.toLowerCase();if(!q){render(data);return;}let f=data.filter(d=>(d.customerName+' '+d.mobile+' '+d.serialNo).toLowerCase().includes(q));render(f);}
async function load(){document.getElementById('st').innerText='SYNCING';try{let r=await fetch(API+'?action=getAll');let t=await r.text();let a=JSON.parse(t);if(Array.isArray(a)&&a.length>1){let hh=a[0];let mm=a.slice(1).map(row=>{let o={};hh.forEach((h,i)=>o[h]=row[i]);return {serialNo:o.SerialNo,customerName:o.CustomerName,mobile:o.Mobile,totalPrice:o.TotalPrice};});if(mm.length>data.length){data=mm;localStorage.setItem('dil_data',JSON.stringify(data));}}}catch(e){}document.getElementById('st').innerText='ONLINE';render(data);}
window.onload=()=>{document.getElementById('orderDate').valueAsDate=new Date();gen();render(data);if(navigator.onLine)load();};
</script></body></html>
