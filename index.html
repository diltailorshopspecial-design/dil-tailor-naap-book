<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دل ٹیلر شاپ - مکمل فائنل V18</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A3D2E">
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#FDF6E3;color:#222}
.h{background:#0A3D2E;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}
.h b{font-size:18px}
.h small{display:block;font-size:11px;opacity:.9}
.wrap{max-width:520px;margin:auto;padding:10px}
.card{background:#fff;border:1.5px solid #C9A86A;border-radius:12px;padding:10px;margin-bottom:10px}
label{font-size:12px;font-weight:bold;display:block;margin-top:8px}
input,select{width:100%;padding:10px;border:1.5px solid #C9A86A;border-radius:8px;margin-top:3px;font-size:15px}
.b{border:none;border-radius:8px;padding:11px;font-weight:bold;cursor:pointer;font-size:14px}
.g{background:#0A3D2E;color:#fff}
.r{background:#B71C1C;color:#fff}
.gr{background:#E8F5E9}
.row{display:flex;gap:6px}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid label{margin-top:4px}
.small{font-size:11px;color:#666;text-align:center}
.kb{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.kb button{padding:8px 10px;border:1px solid #C9A86A;background:#FFF8E1;border-radius:6px;font-size:16px}
.topbtn{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:6px;z-index:20}
img{max-width:100%}
</style>
</head>
<body>
<div class="h"><b>دل ٹیلر شاپ - حسن</b><small>MUKAMMAL FINAL V18 - 03463604869 - گوجرانوالہ</small></div>

<div class="wrap">

<!-- تلاش -->
<div class="card">
<label>🔍 تلاش کریں</label>
<input id="searchBox" placeholder="نام یا موبائل لکھیں..." oninput="doSearch()">
<div id="searchList"></div>
</div>

<!-- کسٹمر -->
<div class="card">
<b>👤 کسٹمر</b>
<label>سریل *</label><input id="serial" type="number" value="63">
<label>نام *</label><input id="custName" placeholder="نام لکھیں - جیسے Sadiq / Zafar">
<label>موبائل</label><input id="mobile" placeholder="0300-1234567">
<div class="row">
<div><label>آرڈر</label><input id="orderDate" type="date"></div>
<div><label>ڈیلیوری</label><input id="deliveryDate" type="date"></div>
</div>
<label>پتہ / نوٹ</label><input id="address" placeholder="پتہ لکھیں">
</div>

<!-- کسٹمر فوٹو - جیسا آپ کا تھا -->
<div class="card">
<b>📸 کسٹمر فوٹو</b>
<input type="file" id="custFile" accept="image/*" capture="environment" hidden onchange="previewCust(event)">
<div id="custPrev" style="text-align:center;margin-top:6px"></div>
<div id="custBtns" style="display:none" class="row">
<button class="b g" onclick="document.getElementById('custFile').click()">📸 فوٹو چینج کرو</button>
<button class="b r" onclick="removeCustPhoto()">🗑️ ڈیلیٹ کرو</button>
</div>
<div class="small">فوٹو پر کلک کر کے بڑا کر کے دیکھ سکتے ہو</div>
<div style="margin-top:6px" class="row">
<button class="b g" onclick="document.getElementById('custFile').click()">📸 گیلری</button>
<button class="b" style="background:#FFF8E1" onclick="document.getElementById('custFile').click()">📷 کیمرہ</button>
</div>
</div>

<!-- ڈیزائن فوٹو - اب بالکل کسٹمر جیسا -->
<div class="card">
<b>🎨 ڈیزائن (5) - ڈیزائن والی فوٹو</b>
<input type="file" id="designFiles" accept="image/*" multiple hidden onchange="previewDesign(event)">
<input type="file" id="designOne" accept="image/*" capture="environment" hidden onchange="previewDesignOne(event)">
<div id="designPrev" style="text-align:center;min-height:40px"></div>

<div style="display:flex;gap:6px;margin-top:8px">
<button class="b g" style="flex:1" onclick="document.getElementById('designFiles').click()">📸 فوٹو چینج کرو / اور لگاؤ</button>
<button class="b r" style="flex:1" onclick="deleteAllDesignPhotos()">🗑️ ڈیلیٹ کرو</button>
</div>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="b" style="background:#FFF8E1;flex:1" onclick="document.getElementById('designFiles').click()">🖼️ گیلری</button>
<button class="b" style="background:#FFF8E1;flex:1" onclick="document.getElementById('designOne').click()">📷 کیمرہ</button>
</div>
<div class="small">فوٹو پر کلک کر کے بڑا کر کے دیکھ سکتے ہو - ہر فوٹو کے نیچے الگ Delete بھی ہے</div>
</div>

<!-- قمیض -->
<div class="card">
<b>👕 قمیض</b>
<div class="grid">
<div><label>لمبائی</label><input id="qLambai" type="number" value="40"></div>
<div><label>بازو</label><input id="qBazu"></div>
<div><label>تیرا</label><input id="qTira"></div>
<div><label>گلا</label><input id="qGala"></div>
<div><label>چھاتی</label><input id="qChati"></div>
<div><label>کمر</label><input id="qKamar"></div>
<div><label>گھیرا</label><input id="qGhera"></div>
<div><label>کف</label><input id="qCuff"></div>
</div>
</div>

<!-- شلوار -->
<div class="card">
<b>👖 شلوار</b>
<div class="grid">
<div><label>لمبائی</label><input id="sLambai"></div>
<div><label>پانچہ</label><input id="sPancha"></div>
<div><label>کمر</label><input id="sKamar"></div>
</div>
<label>قسم</label>
<select id="shalwarType"><option>سادہ</option><option>پٹی والا</option><option>چوڑی دار</option></select>
</div>

<!-- حساب -->
<div class="card">
<b>💰 حساب</b>
<div class="grid">
<div><label>کل</label><input id="total" type="number"></div>
<div><label>ایڈوانس</label><input id="advance" type="number" oninput="calcBaqi()"></div>
</div>
<label>باقی</label><input id="baqi" readonly>
<label>نوٹ</label><input id="note" placeholder="Poora English likho, phir 1 sec ruko, khud Urdu ho jayega">
</div>

<div class="row" style="margin-bottom:70px">
<button class="b g" style="flex:2" onclick="saveRecord()">✅ محفوظ کریں</button>
<button class="b" style="background:#FFEBEE;flex:1" onclick="newRecord()">+ نیا</button>
</div>

<div class="card"><b>📋 ریکارڈ</b><div id="list"></div></div>

</div>

<!-- فوٹو بڑا دیکھنے والا -->
<div id="photoView" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;text-align:center" onclick="this.style.display='none'">
<img id="bigPhoto" style="max-width:95%;max-height:90%;margin-top:20px;border-radius:10px">
<div style="color:#fff">بند کرنے کے لیے کہیں بھی دبائیں</div>
</div>

<script>
var APP_VERSION='v18';
var designB64=[];
var custB64=null;
var editId=null;
var allData=JSON.parse(localStorage.getItem('dil_v18')||'[]');

function comp(f,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var max=800; var w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function openPhoto(src){document.getElementById('bigPhoto').src=src;document.getElementById('photoView').style.display='block';}

// --- کسٹمر فوٹو ---
function previewCust(e){
  var f=e.target.files[0]; if(!f) return;
  comp(f,function(c){
    custB64=c;
    document.getElementById('custPrev').innerHTML='<img onclick="openPhoto(\''+c+'\')" src="'+c+'" width=120 style="border-radius:10px;border:2px solid #C9A86A;cursor:pointer">';
    document.getElementById('custBtns').style.display='flex';
  });
}
function removeCustPhoto(){
  if(!confirm('کسٹمر والی فوٹو ڈیلیٹ کرنی ہے بھائی؟')) return;
  custB64=null;
  document.getElementById('custPrev').innerHTML='';
  document.getElementById('custBtns').style.display='none';
}

// --- ڈیزائن فوٹو - مکمل سیٹنگ ---
function renderDesignPhotos(){
  var h='';
  for(var i=0;i<designB64.length;i++){
    h+='<div style="display:inline-block;margin:3px;text-align:center;vertical-align:top">'
      +'<img onclick="openPhoto(\''+designB64[i]+'\')" src="'+designB64[i]+'" width=60 style="border-radius:6px;border:1.5px solid #C9A86A;cursor:pointer;display:block">'
      +'<button style="background:#B71C1C;color:#fff;border:none;border-radius:6px;font-size:10px;font-weight:bold;padding:5px 0;margin-top:3px;width:60px" onclick="deleteDesignPhoto('+i+')">❌ Delete</button>'
      +'</div>';
  }
  document.getElementById('designPrev').innerHTML=h;
}
function deleteDesignPhoto(idx){
  if(!confirm('یہ والی ڈیزائن فوٹو ڈیلیٹ کرنی ہے بھائی؟')) return;
  designB64.splice(idx,1);
  renderDesignPhotos();
}
function deleteAllDesignPhotos(){
  if(designB64.length==0){alert('کوئی ڈیزائن فوٹو لگی ہی نہیں ہے بھائی');return;}
  if(!confirm('ساری ڈیزائن فوٹو ڈیلیٹ کرنی ہیں بھائی؟')) return;
  designB64=[];
  renderDesignPhotos();
}
function previewDesign(e){
  var fs=e.target.files;
  for(var i=0;i<fs.length;i++){
    if(designB64.length>=5){alert('صرف 5 ڈیزائن فوٹو لگ سکتی ہیں بھائی');break;}
    (function(f){comp(f,function(c){designB64.push(c);renderDesignPhotos();});})(fs[i]);
  }
}
function previewDesignOne(e){
  var f=e.target.files[0];
  if(!f) return;
  if(designB64.length>=5){alert('صرف 5 ڈیزائن فوٹو لگ سکتی ہیں بھائی');return;}
  comp(f,function(c){designB64.push(c);renderDesignPhotos();});
}

// --- حساب ---
function calcBaqi(){
  var t=parseFloat(document.getElementById('total').value||0);
  var a=parseFloat(document.getElementById('advance').value||0);
  document.getElementById('baqi').value=t-a;
}
function newRecord(){
  editId=null; designB64=[]; custB64=null;
  document.getElementById('designPrev').innerHTML='';
  document.getElementById('custPrev').innerHTML='';
  document.getElementById('custBtns').style.display='none';
  ['custName','mobile','address','total','advance','baqi','note','qLambai','qBazu','qTira','qGala','qChati','qKamar','qGhera','qCuff','sLambai','sPancha','sKamar'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('qLambai').value='40';
  document.getElementById('serial').value=allData.length+63;
  window.scrollTo(0,0);
}
function saveRecord(){
  var name=document.getElementById('custName').value.trim();
  if(!name){alert('نام لکھیں بھائی');return;}
  var o={
    id:editId||Date.now(),
    serial:document.getElementById('serial').value,
    name:name,
    mobile:document.getElementById('mobile').value,
    orderDate:document.getElementById('orderDate').value,
    deliveryDate:document.getElementById('deliveryDate').value,
    address:document.getElementById('address').value,
    custPhoto:custB64,
    designPhotos:designB64.slice(),
    q:{l:document.getElementById('qLambai').value,b:document.getElementById('qBazu').value,t:document.getElementById('qTira').value},
    total:document.getElementById('total').value,
    advance:document.getElementById('advance').value,
    baqi:document.getElementById('baqi').value,
    note:document.getElementById('note').value
  };
  if(editId){
    allData=allData.map(function(x){return x.id==editId?o:x;});
  } else { allData.unshift(o); }
  localStorage.setItem('dil_v18',JSON.stringify(allData));
  alert('محفوظ ہو گیا بھائی ✅');
  renderList(); newRecord();
}
function editIdFn(id){
  var o=allData.find(function(x){return x.id==id;}); if(!o) return;
  editId=id;
  document.getElementById('serial').value=o.serial||'';
  document.getElementById('custName').value=o.name||'';
  document.getElementById('mobile').value=o.mobile||'';
  document.getElementById('orderDate').value=o.orderDate||'';
  document.getElementById('deliveryDate').value=o.deliveryDate||'';
  document.getElementById('address').value=o.address||'';
  document.getElementById('total').value=o.total||'';
  document.getElementById('advance').value=o.advance||'';
  document.getElementById('baqi').value=o.baqi||'';
  document.getElementById('note').value=o.note||'';
  if(o.custPhoto){custB64=o.custPhoto;document.getElementById('custPrev').innerHTML='<img onclick="openPhoto(\''+o.custPhoto+'\')" src="'+o.custPhoto+'" width=120 style="border-radius:10px;border:2px solid #C9A86A">';document.getElementById('custBtns').style.display='flex';}
  else {custB64=null;document.getElementById('custPrev').innerHTML='';document.getElementById('custBtns').style.display='none';}
  if(o.designPhotos){designB64=o.designPhotos.slice();renderDesignPhotos();}
  else {designB64=[];renderDesignPhotos();}
  window.scrollTo(0,0);
}
function delRec(id){
  if(!confirm('یہ ریکارڈ ڈیلیٹ کرنا ہے؟')) return;
  allData=allData.filter(function(x){return x.id!=id;});
  localStorage.setItem('dil_v18',JSON.stringify(allData));
  renderList();
}
function renderList(){
  var h='';
  allData.forEach(function(o){
    h+='<div style="border-bottom:1px solid #eee;padding:8px 0"><b>'+o.name+'</b> - '+o.serial+' - باقی: '+(o.baqi||0)+'<br><button class="b g" onclick="editIdFn('+o.id+')">دیکھیں / ایڈٹ</button> <button class="b r" onclick="delRec('+o.id+')">ڈیلیٹ</button></div>';
  });
  document.getElementById('list').innerHTML=h||'کوئی ریکارڈ نہیں';
}
function doSearch(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  if(!q){renderList();return;}
  var f=allData.filter(function(o){return (o.name+' '+o.mobile).toLowerCase().indexOf(q)>-1;});
  var h='';
  f.forEach(function(o){h+='<div style="padding:6px;border:1px solid #eee;border-radius:6px;margin-top:4px" onclick="editIdFn('+o.id+')">👉 '+o.name+' - '+o.mobile+'</div>';});
  document.getElementById('searchList').innerHTML=h;
}
renderList();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=v18');}
</script>
</body>
</html>
